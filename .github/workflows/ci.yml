name: Repository audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_repository.py
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: python tools/reproduce_audit.py
      - run: python tools/summarize_mip_pilot.py
      - run: git diff --exit-code -- evidence/mip-pilot-20261028/results.json evidence/mip-pilot-20261028/SUMMARY.md
